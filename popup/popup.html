<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leetsync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  Here's your problem!
  <p id="problem-name"> </p>
  
  
  <p>Sync it to GitHub?</p>

  <!-- Input username -->
  <label for="usernameInput">Github Username:</label>
  <input type="text" id="usernameInput" placeholder="Enter your GitHub username ">
  <button id="fetchBtn">Load Repositories</button>
  
  <br>

  <!-- Dropdown repo select -->
  <label for="repoSelect">Choose a repository:</label>
  <select id="repoSelect">
  <option value="">-- Select a Repo --</option>
  </select>

  <!-- Sync button -->
   <button id="syncBtn">Sync to GitHub</button>
   <p id="sync-status"></p>

  <script src="popup.js"></script>
</body>
</html>
